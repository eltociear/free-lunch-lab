<style>:root{
  /* 夜空のダーク一色（X の画像と同じ）。システムのライトモードには切り替えない */
  --paper:#0E1320; --paper-2:#1D1733; --surface:#161D2D; --ink:#E5EAF3; --muted:#A3ADC2; --line:#2A3448;
  --accent:#93A8FF; --accent-soft:#222C4A; --stamp:#FF6E61; --pos:#5FD3A0; --pos-soft:#173328; --amber:#F2B84B; --gold:#FFD66B;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -22px rgba(0,0,0,.8); color-scheme:dark;
  --f-display:"GBreve","Dela Gothic One","Noto Sans Devanagari","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"GBreve","Zen Kaku Gothic New","Noto Sans Devanagari","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-dot:"GBreve","DotGothic16","Noto Sans Devanagari","Osaka-Mono","MS Gothic",monospace;
  --f-logo:"FLL Logo","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --s1:clamp(2.3rem,6.4vw,4.3rem); --s2:clamp(1.3rem,3.4vw,2.1rem); --s4:.8125rem;
  /* 主ボタン（紹介リンク）は月の金一色に濃い文字。押すと少し明るい金に */
  --cta:#FFD66B; --cta-hover:#FFE08A; --cta-ink:#141A3A;
}
html[lang="hi"]{--f-display:"GBreve","Noto Sans Devanagari","Dela Gothic One",sans-serif;--f-body:"GBreve","Noto Sans Devanagari","Zen Kaku Gothic New",system-ui,sans-serif}
html[lang="zh-Hans"]{--f-display:"GBreve","Noto Sans SC","Dela Gothic One",sans-serif;--f-body:"GBreve","Noto Sans SC",system-ui,sans-serif;--f-dot:"GBreve","DotGothic16","Noto Sans SC",system-ui,monospace}
html[lang="ar"]{--f-display:"GBreve","Noto Kufi Arabic","Noto Sans Arabic",sans-serif;--f-body:"GBreve","Noto Sans Arabic",system-ui,sans-serif;--f-dot:"GBreve","DotGothic16","Noto Sans Arabic",system-ui,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}p{margin:0}a{color:var(--accent)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow-x:hidden}body{padding:10px}
a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.cx-f{border:0;margin:0;padding:0;min-width:0}
.cx-f legend{padding:0;margin-bottom:10px;font-weight:700;font-size:1rem}
.cx-chips{display:flex;flex-wrap:wrap;gap:8px}
.cx-chip{position:relative;display:inline-flex;max-width:100%}
.cx-chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.cx-chip span{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:.92rem;font-weight:700;line-height:1.3;cursor:pointer;overflow-wrap:anywhere}
.cx-chip span:hover{border-color:var(--muted)}
.cx-chip input:checked+span{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.cx-chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cx-own-in{display:flex;align-items:center;gap:8px}
.cx-num{flex:1;min-width:0;min-height:44px;font:inherit;font-size:1rem;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.cx-num:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.cx-cur{font-size:.875rem;color:var(--muted);font-weight:700}
.cx-total{margin:0;font-weight:700;font-size:clamp(2rem,9vw,3.4rem);line-height:1.15;color:var(--gold);overflow-wrap:anywhere}
.cx-formula{margin:0;color:var(--muted);font-size:.9rem;line-height:1.7}
.cx-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.92rem;line-height:1.5}
.cx-row small{font-size:.8125rem;color:var(--muted)}
.cx-row b{font-size:1.2rem;white-space:nowrap;color:var(--ink)}
.cx-bar{display:block;height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.cx-bar i{display:block;height:100%;background:var(--cta);border-radius:999px}
.cx-sel{display:block;width:100%;max-width:24rem;min-height:44px;margin-top:12px;font:inherit;font-size:.95rem;font-weight:700;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.cx-sel.on{border-color:var(--gold);color:var(--gold)}
.cx-sel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cx-usd{margin:-4px 0 0;color:var(--muted);font-weight:700;font-size:.95rem}
.em{max-width:700px;margin-inline:auto;display:grid;gap:10px}
.em-form{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.em-ctl{display:grid;gap:12px}.em-f{display:grid;gap:6px;min-width:0}
.em-l{display:block;padding:0;font-weight:700;font-size:.875rem}.em .cx-f legend{margin-bottom:6px;font-size:.875rem}
.em .cx-sel{margin-top:0;max-width:none}.em .cx-chip span{min-height:40px;padding:6px 12px;font-size:.875rem}.em .cx-own-in{max-width:20rem}
.em-res{padding:12px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));background:var(--surface);display:grid;gap:4px;min-width:0}
.em-eb{font-size:.8125rem;color:var(--muted)}.em-total{font-size:clamp(1.6rem,8vw,2.4rem)}.cx-usd{margin:0}
.em-gdp{margin-top:6px}.em .cx-formula{font-size:.84rem;line-height:1.6}
.em-by{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:.8125rem}.em-by a{display:inline-block;padding-block:6px;text-decoration:none}.em-by a:hover{text-decoration:underline}</style>
